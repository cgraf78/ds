name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    uses: cgraf78/actions/.github/workflows/shell-ci.yml@1db322ef8a998a904974d0c81fb94515d1b16973
    with:
      matrix-set: full
      profiles: base,openssh-netcat-lsof,procps,shellcheck
      test-command: bash tests/ds-ci
