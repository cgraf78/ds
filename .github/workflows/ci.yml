name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    uses: cgraf78/actions/.github/workflows/shell-ci.yml@1675121b79a8c194816606a74b21920f4a402592
    with:
      matrix-set: full
      profiles: base,openssh-netcat-lsof,procps,shellcheck
      termux-profiles: runtime,shellcheck
      test-command: bash tests/ds-ci
      termux-command: |-
        echo "Checking ds entrypoint"
        shellcheck -x bin/ds
        echo "Checking ds plugins"
        shellcheck -x lib/plugins/*.sh
        echo "Running ds help smoke"
        timeout 30 bash bin/ds --help
