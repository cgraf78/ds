name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    uses: cgraf78/actions/.github/workflows/shell-ci.yml@100dcd7d648099972821db4d6c80628e07f54446
    with:
      matrix-set: full
      profiles: base,openssh-netcat-lsof,procps,shellcheck
      termux-profiles: runtime,shellcheck
      test-command: bash tests/ds-ci
      termux-command: |-
        shellcheck -x bin/ds
        shellcheck -x lib/plugins/*.sh
        shellcheck -e SC2317 -x -P SCRIPTDIR tests/ds-test tests/test-helpers.sh
        bash bin/ds --help
