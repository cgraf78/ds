# Example data-profile config for ds
# Declares trivial single-command profiles as data, instead of a separate
# profile-<name>.sh file each. Place this file at
# ${XDG_CONFIG_HOME:-$HOME/.config}/ds/profile.conf
#
# Each row is: <name> <window> <command...>
#   name     profile/session name (letters, digits, underscore)
#   window   tmux window-1 name
#   command  rest of the line; sent to the window (may contain spaces; omit for
#            a rename-only profile)
#
# A profile-<name>.sh of the same name always overrides a row here, so reach for
# a .sh file when a profile needs a real multi-window/pane layout.
#
# name     window   command
# argus    argus    argus
# claude   claude   claude
# notes    notes    nvim ~/notes
