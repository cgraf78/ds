# Example share-upterm.conf for ds
# Place at ${XDG_CONFIG_HOME:-$HOME/.config}/ds/share-upterm.conf
#
# The public upstream service and default lifetime are active so CI exercises
# this file with the production loader. Uncomment and replace only the access
# controls your deployment actually owns.
server=uptermd.upterm.dev:22
# known-hosts=~/.ssh/upterm_known_hosts
# private-key=~/.ssh/id_ed25519
# github-user=myghuser
# authorized-keys=~/.ssh/upterm_authorized_keys
# push=user@remotehost
share-ttl=3600
